<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato | Herlon Verissimo</title>
<meta name="description" content="Portfólio pessoal de Herlon Verissimo, profissional da área de Gestão Comercial.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
  <a class="marca" href="index.html">Herlon Verissimo</a>
  <nav aria-label="Principal"><a href="index.html">Início</a><a href="curriculo.html">Currículo</a><a href="formulario.html" aria-current="page">Contato</a><a href="multimidia.html">Multimídia</a><a href="graficos.html">Gráficos</a></nav>
  <button id="btn-tema" type="button">Tema</button>
</header>
<main id="conteudo" tabindex="-1">
<section class="bloco">
  <h1>Fale comigo</h1>
  <form id="form-contato" novalidate>
    <div class="campo mb-3">
      <label class="form-label" for="nome">Nome</label>
      <input id="nome" name="nome" class="form-control" type="text" autocomplete="name" required minlength="3" aria-describedby="erro-nome">
      <small class="erro" id="erro-nome"></small>
    </div>
    <div class="campo mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" name="email" class="form-control" type="email" autocomplete="email" required aria-describedby="erro-email">
      <small class="erro" id="erro-email"></small>
    </div>
    <div class="campo mb-3">
      <label class="form-label" for="assunto">Assunto</label>
      <select id="assunto" name="assunto" class="form-select" required aria-describedby="erro-assunto">
        <option value="">Selecione</option>
        <option>Oportunidade</option><option>Projeto</option><option>Dúvida</option>
      </select>
      <small class="erro" id="erro-assunto"></small>
    </div>
    <div class="campo mb-3">
      <label class="form-label" for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" class="form-control" rows="5" required minlength="10" aria-describedby="erro-mensagem"></textarea>
      <small class="erro" id="erro-mensagem"></small>
    </div>
    <button type="submit">Enviar mensagem</button>
    <p id="msg-form" class="feedback" role="status" aria-live="polite"></p>
  </form>
  <h2>Mensagens enviadas neste navegador</h2>
  <ul id="lista-mensagens" class="lista"></ul>
</section>
</main>
<footer class="rodape"><p>© 2026 Herlon Verissimo. Feito com HTML, CSS, JavaScript e Bootstrap.</p></footer>
<script src="js/scripts.js"></script>
</body>
</html>
